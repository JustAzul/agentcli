name: dist

# Publishes the plugin build (hooks, skill, manifest, LICENSE, README) as a
# single orphan commit on the dist branch, which the marketplace manifest on
# main points at, and creates the GitHub release of a version that has none,
# tagged on that commit. Runs are serialized; a newer push cancels an older run.

on:
  push:
    branches: [main]

concurrency:
  group: dist
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    env:
      # The engine's PII scan, pinned to a commit of the engine's main branch (its
      # release tags name dist builds, which hold no Go module). Bump the pin when
      # the tool changes.
      PIISCAN: github.com/JustAzul/cc-msgate/tools/piiscan@05d04bfd34e829e253f4152e7d81fda2bd40aa5e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release-notes.sh lists the commits since the previous version
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - name: Manifests
        run: scripts/test-manifests.sh
      - name: Dispatch skill
        run: scripts/test-skill.sh
      - name: Dist tree
        run: scripts/test-dist.sh
      - name: PII scan of tracked files
        run: go run "$PIISCAN" --tracked .
      - name: Build dist tree
        run: sh scripts/build-dist.sh "$RUNNER_TEMP/dist"
      - name: PII scan of the dist tree
        run: go run "$PIISCAN" --allowlist testdata/pii-allowlist.txt "$RUNNER_TEMP/dist"
      - name: Publish
        id: publish
        run: |
          set -eu
          remote=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$remote" != "$GITHUB_SHA" ]; then
            echo "main is now ${remote:-unknown}, not $GITHUB_SHA: this build is stale, not publishing"
            exit 0
          fi
          git checkout --orphan dist-publish
          git rm -rf --quiet .
          cp -R "$RUNNER_TEMP/dist/." .
          git add -A -f
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "dist: build of $GITHUB_SHA"
          git push --force origin HEAD:refs/heads/dist
          echo "dist_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Release
        if: steps.publish.outputs.dist_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_SHA: ${{ steps.publish.outputs.dist_sha }}
        run: |
          set -eu
          git checkout --quiet --detach "$GITHUB_SHA"
          sh scripts/publish-release.sh "$DIST_SHA" "$GITHUB_SHA"
